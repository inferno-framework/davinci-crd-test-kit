---
:resource: MedicationRequest
:profile_url: http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-medicationrequest
:profile_name: CRD Medication Request
:profile_version: 2.2.1
:must_supports:
  :extensions:
  - :id: MedicationRequest.extension:Coverage-Information
    :slice_name: Coverage-Information
    :path: extension
    :url: http://hl7.org/fhir/us/davinci-crd/StructureDefinition/ext-coverage-information
    :modifier_extension: false
  - :id: MedicationRequest.medication[x]:medicationCodeableConcept.extension:BillingOptions
    :slice_name: BillingOptions
    :path: medication[x].extension
    :url: http://hl7.org/fhir/us/davinci-crd/StructureDefinition/ext-billing-options
    :modifier_extension: false
  :slices:
  - :slice_id: MedicationRequest.category:encounterType
    :slice_name: encounterType
    :path: category
    :discriminator:
      :type: requiredBinding
      :path: ''
      :values:
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: inpatient
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: outpatient
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: community
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: discharge
  - :slice_id: MedicationRequest.category:serviceType
    :slice_name: serviceType
    :path: category
    :discriminator:
      :type: requiredBinding
      :path: ''
      :values:
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: inpatient
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: outpatient
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: community
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: discharge
  - :slice_id: MedicationRequest.category:us-core
    :slice_name: us-core
    :path: category
    :discriminator:
      :type: requiredBinding
      :path: ''
      :values:
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: inpatient
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: outpatient
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: community
      - :system: http://terminology.hl7.org/CodeSystem/medicationrequest-category
        :code: discharge
  - :slice_id: MedicationRequest.medication[x]:medicationCodeableConcept
    :slice_name: medicationCodeableConcept
    :path: medication[x]
    :discriminator:
      :type: type
      :code: CodeableConcept
  - :slice_id: MedicationRequest.medication[x]:medicationReference
    :slice_name: medicationReference
    :path: medication[x]
    :discriminator:
      :type: type
      :code: Reference
  :elements:
  - :path: authoredOn
  - :path: category
  - :path: contained
  - :path: dispenseRequest
  - :path: dispenseRequest.numberOfRepeatsAllowed
  - :path: dispenseRequest.performer
    :types:
    - Reference
    :target_profiles:
    - http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-organization
  - :path: dispenseRequest.quantity
  - :path: dosageInstruction
  - :path: dosageInstruction.doseAndRate
  - :path: dosageInstruction.doseAndRate.doseQuantity
    :original_path: dosageInstruction.doseAndRate.dose[x]
  - :path: dosageInstruction.text
  - :path: dosageInstruction.timing
  - :path: encounter
    :types:
    - Reference
    :target_profiles:
    - http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-encounter
  - :path: identifier
  - :path: intent
  - :path: medication[x]
    :types:
    - Reference
  - :path: performer
    :types:
    - Reference
    :target_profiles:
    - http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-practitioner
    - http://hl7.org/fhir/us/davinci-hrex/StructureDefinition/hrex-practitionerrole
  - :path: priorPrescription
    :types:
    - Reference
    :target_profiles:
    - http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-medicationrequest
  - :path: reasonCode
  - :path: reasonReference
    :types:
    - Reference
  - :path: reportedBoolean
    :original_path: reported[x]
  - :path: reportedReference
    :original_path: reported[x]
    :types:
    - Reference
  - :path: requester
    :types:
    - Reference
    :target_profiles:
    - http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-practitioner
  - :path: status
  - :path: subject
    :types:
    - Reference
    :target_profiles:
    - http://hl7.org/fhir/us/core/StructureDefinition/us-core-patient|7.0.0
  - :path: substitution
  :recursive_elements: []
