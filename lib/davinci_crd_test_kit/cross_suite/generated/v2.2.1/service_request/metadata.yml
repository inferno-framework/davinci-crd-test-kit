---
:resource: ServiceRequest
:profile_url: http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-servicerequest
:profile_name: CRD Service Request
:profile_version: 2.2.1
:must_supports:
  :extensions:
  - :id: ServiceRequest.code.extension:BillingOptions
    :slice_name: BillingOptions
    :path: code.extension
    :url: http://hl7.org/fhir/us/davinci-crd/StructureDefinition/ext-billing-options
    :modifier_extension: false
  - :id: ServiceRequest.extension:Coverage-Information
    :slice_name: Coverage-Information
    :path: extension
    :url: http://hl7.org/fhir/us/davinci-crd/StructureDefinition/ext-coverage-information
    :modifier_extension: false
  - :id: ServiceRequest.performerType.extension:codeOptions
    :slice_name: codeOptions
    :path: performerType.extension
    :url: http://hl7.org/fhir/StructureDefinition/codeOptions
    :modifier_extension: false
  :slices:
  - :slice_id: ServiceRequest.category:serviceType
    :slice_name: serviceType
    :path: category
    :discriminator:
      :type: requiredBinding
      :path: ''
      :values:
      - :system: https://codesystem.x12.org/005010/1365
  - :slice_id: ServiceRequest.locationCode.coding:cms
    :slice_name: cms
    :path: locationCode.coding
    :discriminator:
      :type: requiredBinding
      :path: ''
      :values:
      - :system: https://www.cms.gov/Medicare/Coding/place-of-service-codes/Place_of_Service_Code_Set
  - :slice_id: ServiceRequest.locationCode.coding:nubc
    :slice_name: nubc
    :path: locationCode.coding
    :discriminator:
      :type: requiredBinding
      :path: ''
      :values:
      - :system: https://www.nubc.org/CodeSystem/TypeOfBill
  - :slice_id: ServiceRequest.locationCode.coding:nucc
    :slice_name: nucc
    :path: locationCode.coding
    :discriminator:
      :type: requiredBinding
      :path: ''
      :values:
      - :system: http://nucc.org/provider-taxonomy
  - :slice_id: ServiceRequest.reasonCode.coding:ICD10
    :slice_name: ICD10
    :path: reasonCode.coding
    :discriminator:
      :type: requiredBinding
      :path: ''
      :values:
      - :system: http://hl7.org/fhir/sid/icd-10-cm
  :elements:
  - :path: authoredOn
  - :path: basedOn
    :types:
    - Reference
  - :path: category
  - :path: code
  - :path: contained
  - :path: doNotPerform
  - :path: encounter
    :types:
    - Reference
    :target_profiles:
    - http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-encounter
  - :path: identifier
  - :path: intent
  - :path: locationCode
  - :path: locationReference
    :types:
    - Reference
    :target_profiles:
    - http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-location
  - :path: occurrencePeriod
    :original_path: occurrence[x]
  - :path: occurrenceTiming
    :original_path: occurrence[x]
  - :path: performer
    :types:
    - Reference
    :target_profiles:
    - http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-practitioner
    - http://hl7.org/fhir/us/davinci-hrex/StructureDefinition/hrex-practitionerrole
    - http://hl7.org/fhir/us/davinci-hrex/StructureDefinition/hrex-organization
  - :path: performerType
  - :path: quantity[x]
  - :path: reasonCode
  - :path: reasonReference
    :types:
    - Reference
  - :path: requester
    :types:
    - Reference
    :target_profiles:
    - http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-practitioner
    - http://hl7.org/fhir/us/davinci-hrex/StructureDefinition/hrex-practitionerrole
  - :path: status
  - :path: subject
    :types:
    - Reference
    :target_profiles:
    - http://hl7.org/fhir/us/davinci-crd/StructureDefinition/profile-patient
  :recursive_elements: []
