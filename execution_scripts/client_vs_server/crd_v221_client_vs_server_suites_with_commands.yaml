    action_description: Wait while the requests are sent

  - state_description: Finished Server Group 3.1 Hook Tests > appointment-book (Subset)
    session: server-subset
    status: done
    last_completed: 3.1
    command: "curl -o /dev/null -s '{client.wait_outputs.continuation_url}'"
    next_poll_session: client
    action_description: Indicate that appointment-book invocations are complete

  - state_description: Wait at Client test 1.2.1.2.01 Client displays returned decision support details to the user
