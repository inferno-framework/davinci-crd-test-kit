sessions:
  - suite: crd_client_v221
    name: client
    preset: inferno-crd-server-suite-v221
    suite_options:
      us_core_version: us_core_3
  - suite: crd_server_v221
    name: server-full
    preset: inferno-crd-client-suite-v221
  - suite: crd_server_v221
    name: server-subset
    preset: inferno-crd-client-suite-prefetch-subset-v221
  - suite: crd_server_v221
    name: server-full-additional
    preset: inferno-crd-client-suite-v221
  - suite: crd_server_v221
    name: server-subset-additional
    preset: inferno-crd-client-suite-prefetch-subset-v221

comparison_config:
  normalized_strings:
    - replacement: <INFERNO_HOST>
      patterns:
        - http://localhost:4567/inferno # local inferno core ruby
        - http://localhost:4567 # local ruby
        - http://localhost # local docker
        - https://inferno.healthit.gov/suites # prod
        - https://inferno-qa.healthit.gov/suites # qa
    - replacement: <UUID>
      pattern: /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i
    - replacement: <RANDOM_KEY>
      pattern: /'[a-z]{16}'/
    - replacement: <INFERNO_URL>
      patterns:
        - https://inferno.healthit.gov/ # prod
        - https://inferno-qa.healthit.gov/ # qa
  sessions:
    client:
      expected_results_file: crd_v221_client_vs_server_suites_with_commands_client_expected.json
      alternate_expected_files:
        - file: crd_v221_client_vs_server_suites_with_commands_no_ssl_client_expected.json
          when:
            - field: inferno_base_url
              not_matches: https
    server-full:
      expected_results_file: crd_v221_client_vs_server_suites_with_commands_server-full_expected.json
      alternate_expected_files:
        - file: crd_v221_client_vs_server_suites_with_commands_no_ssl_server-full_expected.json
          when:
            - field: inferno_base_url
              not_matches: https
    server-full-additional:
      expected_results_file: crd_v221_client_vs_server_suites_with_commands_server-full-additional_expected.json
      alternate_expected_files:
        - file: crd_v221_client_vs_server_suites_with_commands_no_ssl_server-full-additional_expected.json
          when:
            - field: inferno_base_url
              not_matches: https
    server-subset:
      expected_results_file: crd_v221_client_vs_server_suites_with_commands_server-subset_expected.json
      alternate_expected_files:
        - file: crd_v221_client_vs_server_suites_with_commands_no_ssl_server-subset_expected.json
          when:
            - field: inferno_base_url
              not_matches: https
    server-subset-additional:
      expected_results_file: crd_v221_client_vs_server_suites_with_commands_server-subset-additional_expected.json
      alternate_expected_files:
        - file: crd_v221_client_vs_server_suites_with_commands_no_ssl_server-subset-additional_expected.json
          when:
            - field: inferno_base_url
              not_matches: https

steps:
  - state_description: client session created
    session: client
    status: created
    start_run:
      session: client
      runnable: 1.1
    action_description: Run Client Group 1.1 Client Registration

  - state_description: Wait at Client test 1.1.02 (attestation)
    session: client
    status: waiting
    last_completed: 1.1.02
    command: "curl -o /dev/null -s '{wait_outputs.attest_true_url}'"
    action_description: GET the attestation URL

  - state_description: Finished Client Group 1.1 Client Registration
    session: client
    status: done
    last_completed: 1.1
    start_run:
      session: server-full
      runnable: 1
    next_poll_session: server-full
    action_description: Run Server Group 1 Discovery (Full)

  #############################################################
  # Server Discovery (full and subset sessions)
  #############################################################

  - state_description: Finished Server Group 1 Discovery (Full)
    session: server-full
    status: done
    last_completed: 1
    start_run:
      session: server-full-additional
      runnable: 1
    next_poll_session: server-full-additional
    action_description: Run Server Group 1 Discovery (Full Additional)

  - state_description: Finished Server Group 1 Discovery (Full Additional)
    session: server-full-additional
    status: done
    last_completed: 1
    start_run:
      session: server-subset
      runnable: 1
    next_poll_session: server-subset
    action_description: Run Server Group 1 Discovery (Subset)

  - state_description: Finished Server Group 1 Discovery (Subset)
    session: server-subset
    status: done
    last_completed: 1
    start_run:
      session: server-subset-additional
      runnable: 1
    next_poll_session: server-subset-additional
    action_description: Run Server Group 1 Discovery (Subset Additional)
    
  - state_description: Finished Server Group 1 Discovery (Subset Additional)
    session: server-subset-additional
    status: done
    last_completed: 1
    start_run:
      session: client
      runnable: 1.2.1
    next_poll_session: client
    action_description: Run Client Group 1.2.1 Hooks > appointment-book

  #############################################################
  # Appointment Book
