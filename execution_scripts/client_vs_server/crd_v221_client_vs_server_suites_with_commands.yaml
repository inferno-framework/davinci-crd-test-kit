    status: waiting
    last_completed: 3.1.1.01
    action: WAIT
    action_description: Wait while the requests are sent
    timeout: 300

  - state_description: Finished Server Group 3.1 Hook Tests > appointment-book (Full)
    session: server-full
    status: done
    last_completed: 3.1
    start_run:
      session: server-subset
      runnable: 3.1
    next_poll_session: server-subset
