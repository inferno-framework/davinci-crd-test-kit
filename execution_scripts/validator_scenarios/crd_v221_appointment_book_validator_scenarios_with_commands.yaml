# Exercises the CRD v2.2.1 handling of validator messages for Appointments with one appointment-book exchange:
# - the server session sends crafted hook requests (inputs/v221_appointment_book_request_bodies.json) whose
#   context.appointments the client session validates (Appointment participant slices, Bundle entry issues), and
# - the server session also validates the Appointments in its own requests (suite-level Appointment participant
#   slice filter). The client session answers with a plain instructions card
#   (inputs/v221_appointment_book_response_template.json): a coverage information response would make the server
#   session send a varying number of extra requests.
# Each scenario is named in the Appointment ids and descriptions in the input file.
sessions:
  - suite: crd_client_v221
    name: client
    preset: inferno-crd-server-suite-v221
    suite_options:
      us_core_version: us_core_3
  - suite: crd_server_v221
    name: server
    preset: inferno-crd-client-suite-v221

comparison_config:
  normalized_strings:
    - replacement: <INFERNO_HOST>
      patterns:
        - https://localhost:8443 # local ruby with TLS
        - http://localhost:4567/inferno # local inferno core ruby
        - http://localhost:4567 # local ruby
        - http://localhost # local docker
        - https://inferno.healthit.gov/suites # prod
        - https://inferno-qa.healthit.gov/suites # qa
    - replacement: <UUID>
      pattern: /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i
    - replacement: <RANDOM_KEY>
      pattern: /'[a-z]{16}'/
    - replacement: <INFERNO_URL>
      patterns:
        - https://inferno.healthit.gov/ # prod
        - https://inferno-qa.healthit.gov/ # qa
  sessions:
    client:
      expected_results_file: crd_v221_appointment_book_validator_scenarios_with_commands_client_expected.json
      alternate_expected_files:
        - file: crd_v221_appointment_book_validator_scenarios_with_commands_client_no_ssl_expected.json
          when:
            - field: inferno_base_url
              not_matches: https
    server:
      expected_results_file: crd_v221_appointment_book_validator_scenarios_with_commands_server_expected.json
      alternate_expected_files:
        - file: crd_v221_appointment_book_validator_scenarios_with_commands_server_no_ssl_expected.json
          when:
            - field: inferno_base_url
              not_matches: https

steps:
  - state_description: client session created
    session: client
    status: created
    start_run:
      session: client
      runnable: 1.2.1
      inputs:
        appointment_book_response_approach: custom
        appointment_book_custom_response_template: "@inputs/v221_appointment_book_response_template.json"
    action_description: Run Client Group 1.2.1 Hooks > appointment-book with a plain instructions card

  - state_description: Wait at Client test 1.2.1.1.01 Requests received for appointment-book hook
    session: client
    status: waiting
    last_completed: 1.2.1.1.01
    start_run:
      session: server
      runnable: 3.1
      inputs:
        appointment_book_service_ids: appointment-book-service
        appointment_book_request_bodies: "@inputs/v221_appointment_book_request_bodies.json"
    next_poll_session: server
    action_description: Run Server Group 3.1 Hook Tests > appointment-book with the scenario requests
    timeout: 900 # validation of the crafted content can take several minutes

  - state_description: Wait at Server test 3.1.1.01
    session: server
    status: waiting
    last_completed: 3.1.1.01
    action: WAIT
    action_description: Wait while the requests are sent
    timeout: 900

  - state_description: Finished Server Group 3.1 Hook Tests > appointment-book
    session: server
    status: done
    last_completed: 3.1
    command: "curl -o /dev/null -s '{client.wait_outputs.continuation_url}'"
    next_poll_session: client
    action_description: Indicate that appointment-book invocations are complete
    timeout: 900

  - state_description: Wait at Client test 1.2.1.2.01 Client displays returned decision support details to the user
    session: client
    status: waiting
    last_completed: 1.2.1.2.01
    command: "curl -o /dev/null -s '{wait_outputs.attest_true_url}'"
    action_description: Attest that the cards have been displayed
    timeout: 900

  - state_description: Finished Client Group 1.2.1 appointment-book
    session: client
    status: done
    last_completed: 1.2.1
    action: END_SCRIPT
    action_description: Script Completed
    timeout: 900
