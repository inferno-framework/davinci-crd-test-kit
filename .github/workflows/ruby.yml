name: Ruby

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby-version: ["3.3.6"]

    steps:
      - uses: actions/checkout@v2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

  verify-test-generation:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby-version: ["3.3.6"]
    steps:
      - uses: actions/checkout@v2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Verify test generation is up to date
        run: |
          bundle exec inferno migrate
          bundle exec rake crd:generate
          GENERATED_DIRS="lib/davinci_crd_test_kit/cross_suite/generated lib/davinci_crd_test_kit/client/v2.2.1/must_support/generated"
          if [[ -n "$(git status --porcelain $GENERATED_DIRS)" ]]; then
            echo "Generated tests are outdated. Run 'bundle exec rake crd:generate' and commit the changes."
            git status $GENERATED_DIRS
            git diff $GENERATED_DIRS
            exit 1
          fi

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby-version: ["3.3.6"]
    steps:
      - uses: actions/checkout@v2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run tests
        run: bundle exec rake

  lint:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby-version: ["3.3.6"]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Rubocop
        run: bundle exec rubocop

  requirements:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby-version: ["3.3.6"]
    steps:
      - uses: actions/checkout@v2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Check Export
        run: bundle exec inferno requirements check
      - name: Check Coverage
        run: bundle exec inferno requirements check_coverage
